name: PythonSpinDynamics Documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/python-spin-dynamics-docs.yml"
      - "PythonSpinDynamics/mkdocs.yml"
      - "PythonSpinDynamics/pyproject.toml"
      - "PythonSpinDynamics/docs/**"
      - "PythonSpinDynamics/src/**"
      # The static NQR Spectra Explorer is published under /nqr/ on the same site.
      - "NQRDatabase/app/**"
      - "NQRDatabase/data/exports/**"
      - "NQRDatabase/scripts/build_static_explorer.py"
  pull_request:
    paths:
      - ".github/workflows/python-spin-dynamics-docs.yml"
      - "PythonSpinDynamics/mkdocs.yml"
      - "PythonSpinDynamics/pyproject.toml"
      - "PythonSpinDynamics/docs/**"
      - "PythonSpinDynamics/src/**"
      # The static NQR Spectra Explorer is published under /nqr/ on the same site.
      - "NQRDatabase/app/**"
      - "NQRDatabase/data/exports/**"
      - "NQRDatabase/scripts/build_static_explorer.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: PythonSpinDynamics

jobs:
  build:
    name: Build searchable documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: PythonSpinDynamics/pyproject.toml
      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs,lite]"
      - name: Verify generated API reference
        run: |
          python docs/generate_api_reference.py
          git diff --exit-code docs/python_api/api_reference.md
      - name: Install TeX Live for the PDF manual
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended cm-super lmodern poppler-utils
      - name: Build PDF manual
        # Not tracked in git; MkDocs publishes docs/user_manual.pdf with the site.
        run: python docs/build_manual.py
      - name: Check the PDF embeds only scalable fonts
        run: |
          if pdffonts docs/user_manual.pdf | grep -q "Type 3"; then
            pdffonts docs/user_manual.pdf | grep "Type 3"
            echo "bitmap (Type 3) fonts in user_manual.pdf; install cm-super" >&2
            exit 1
          fi
      - name: Upload PDF manual
        uses: actions/upload-artifact@v4
        with:
          name: python-spin-dynamics-user-manual
          path: PythonSpinDynamics/docs/user_manual.pdf
          if-no-files-found: error
      - name: Build site with strict warnings
        run: python -m mkdocs build --strict
      - name: Add the static NQR Spectra Explorer under /nqr/
        run: python ../NQRDatabase/scripts/build_static_explorer.py --out site/nqr
      - name: Add the in-browser notebooks (JupyterLite) under /lite/
        run: python docs/lite/build_lite.py --out site/lite
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: PythonSpinDynamics/site

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
