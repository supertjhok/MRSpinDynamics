name: PythonSpinDynamics Documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/python-spin-dynamics-docs.yml"
      - "PythonSpinDynamics/mkdocs.yml"
      - "PythonSpinDynamics/pyproject.toml"
      - "PythonSpinDynamics/docs/**"
      - "PythonSpinDynamics/src/**"
  pull_request:
    paths:
      - ".github/workflows/python-spin-dynamics-docs.yml"
      - "PythonSpinDynamics/mkdocs.yml"
      - "PythonSpinDynamics/pyproject.toml"
      - "PythonSpinDynamics/docs/**"
      - "PythonSpinDynamics/src/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: PythonSpinDynamics

jobs:
  build:
    name: Build searchable documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: PythonSpinDynamics/pyproject.toml
      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs]"
      - name: Verify generated API reference
        run: |
          python docs/generate_api_reference.py
          git diff --exit-code docs/python_api/api_reference.md
      - name: Build site with strict warnings
        run: python -m mkdocs build --strict
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: PythonSpinDynamics/site

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
