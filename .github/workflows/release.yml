name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (without leading v), e.g. 0.1.0"
        required: true

# Least privilege by default; only the final job may write (create the
# tag/release).
permissions:
  contents: read

jobs:
  release-guard:
    name: Resolve version and check release source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      # Passed via env (never interpolated into the script) so a crafted input
      # cannot inject shell.
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            value="$INPUT_VERSION"
          else
            value="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+([abrc][0-9A-Za-z.]*)?$ ]]; then
            echo "::error::invalid release version: '$value'" >&2
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Release only from main
        shell: bash
        run: |
          # workflow_dispatch must be started from main; a pushed tag must point
          # at a commit already on main. Either way a release cannot be cut from
          # an arbitrary branch.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::manual releases must be dispatched from main (got $GITHUB_REF)" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main" >&2
            exit 1
          fi

  release-tests:
    name: Pre-release tests
    needs: release-guard
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workspace (editable) with test extras
        run: |
          python -m pip install -e "./PythonSpinDynamics[dev,opt,plot]"
          python -m pip install -e ./QuadrupolarDFT -e ./integration
      - name: PythonSpinDynamics smoke job (lint, generated docs, smoke tests)
        working-directory: PythonSpinDynamics
        run: |
          python -m ruff check src tests examples
          python docs/generate_api_reference.py
          git diff --exit-code docs/python_api/api_reference.md
          python docs/generate_validation_matrix.py --check
          python -m unittest tests.smoke_tests
          python -m unittest tests.test_perf_golden
          python -m mypy
      - name: QuadrupolarDFT tests
        working-directory: QuadrupolarDFT
        run: python -m unittest discover -s tests
      - name: Integration tests
        working-directory: integration
        run: python -m unittest discover -s tests
      - name: NQRDatabase validation and tests
        run: |
          python NQRDatabase/scripts/validate_database.py
          (cd NQRDatabase && python -m unittest discover -s tests)

  github-release:
    name: Create GitHub Release (Zenodo archives it)
    needs: [release-guard, release-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      RELEASE_VERSION: ${{ needs.release-guard.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify workspace versions agree with the tag
        run: |
          python scripts/check_versions.py
          declared=$(python scripts/check_versions.py | awk '/workspace version is/ {print $NF}')
          if [ "$declared" != "$RELEASE_VERSION" ]; then
            echo "Tag/input $RELEASE_VERSION != declared $declared" >&2
            exit 1
          fi
          python scripts/release_preflight.py \
            --expected-version "$RELEASE_VERSION" \
            --require-clean
      - name: Build workspace distributions
        run: |
          python -m pip install build twine
          mkdir release-artifacts
          python -m build --outdir release-artifacts PythonSpinDynamics
          python -m build --outdir release-artifacts QuadrupolarDFT
          python -m build --outdir release-artifacts integration
          python -m twine check release-artifacts/*
      - name: Test workspace artifact installation
        run: |
          python -m venv .release-test
          # Third-party runtime dependencies come from PyPI; the workspace
          # packages must come from the freshly built artifacts only
          # (--no-index), never from a same-named/same-version index upload.
          .release-test/bin/python -m pip install "numpy>=1.24"
          .release-test/bin/python -m pip install --no-index \
            --find-links release-artifacts \
            "mr-integration==$RELEASE_VERSION"
          .release-test/bin/spin-dynamics --version
          .release-test/bin/spin-dynamics --help
          .release-test/bin/python PythonSpinDynamics/scripts/verify_installed_distribution.py
          .release-test/bin/python -c "import quadrupolar_dft, mr_integration"
          MR_INTEGRATION_REPO_ROOT="$PWD" .release-test/bin/python -c \
            "import mr_integration as m; assert m.measured_lines('NaNO2', isotope='14N')"
      - name: Add manuals and verify release contents
        run: |
          cp PythonSpinDynamics/docs/user_manual.pdf \
            release-artifacts/python_spin_dynamics_user_manual.pdf
          cp QuadrupolarDFT/docs/user_manual.pdf \
            release-artifacts/quadrupolar_dft_user_manual.pdf
          cp MATLABSpinDynamics/docs/user_manual.pdf \
            release-artifacts/matlab_spin_dynamics_user_manual.pdf
          python scripts/release_preflight.py \
            --expected-version "$RELEASE_VERSION" \
            --artifacts-dir release-artifacts \
            --check-generated
          python scripts/write_sha256s.py release-artifacts
      - name: Build release notes from CHANGELOG
        run: python scripts/extract_changelog.py "$RELEASE_VERSION" > release_notes.md
      - name: Create GitHub Release
        # softprops/action-gh-release v2 (= v2.6.2), pinned by commit SHA because
        # this job holds contents: write. Update the SHA deliberately.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.release-guard.outputs.version }}
          name: v${{ needs.release-guard.outputs.version }}
          body_path: release_notes.md
          files: release-artifacts/*
