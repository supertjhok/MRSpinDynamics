name: PythonSpinDynamics

on:
  push:
    paths:
      - ".github/workflows/python-spin-dynamics.yml"
      - "PythonSpinDynamics/**"
      # Sibling-project inputs read by PSD tests/examples:
      # tests/test_piezo_detection.py and examples read the NQR export and the
      # glycine CIF; tests/test_nqr_database_relaxation_audit.py reads
      # NQRDatabase/data/normalized; examples read the NaNO2 DFT summary;
      # tests/test_nqr_cif.py checks the CIF reader twin stays in sync.
      - "NQRDatabase/data/**"
      - "QuadrupolarDFT/structures/**"
      - "QuadrupolarDFT/results/**"
      - "QuadrupolarDFT/src/quadrupolar_dft/_cif.py"
  pull_request:
    paths:
      - ".github/workflows/python-spin-dynamics.yml"
      - "PythonSpinDynamics/**"
      # Sibling-project inputs read by PSD tests/examples:
      # tests/test_piezo_detection.py and examples read the NQR export and the
      # glycine CIF; tests/test_nqr_database_relaxation_audit.py reads
      # NQRDatabase/data/normalized; examples read the NaNO2 DFT summary;
      # tests/test_nqr_cif.py checks the CIF reader twin stays in sync.
      - "NQRDatabase/data/**"
      - "QuadrupolarDFT/structures/**"
      - "QuadrupolarDFT/results/**"
      - "QuadrupolarDFT/src/quadrupolar_dft/_cif.py"

defaults:
  run:
    working-directory: PythonSpinDynamics

env:
  PYTHONUTF8: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  smoke:
    name: Smoke tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: PythonSpinDynamics/pyproject.toml
      - name: Install package
        run: python -m pip install -e ".[dev,opt,plot]"
      - name: Lint
        run: python -m ruff check src tests examples
      - name: Check generated API reference
        run: |
          python docs/generate_api_reference.py
          git diff --exit-code docs/python_api/api_reference.md
      - name: Check validation evidence registry
        run: python docs/generate_validation_matrix.py --check
      - name: Check documentation snippets (syntax and imports)
        run: python docs/check_doc_snippets.py
      - name: Smoke tests
        run: python -m unittest tests.smoke_tests

  validation:
    name: Baseline mypy, coverage, and full validation (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: PythonSpinDynamics/pyproject.toml
      - name: Install package
        run: python -m pip install -e ".[dev,opt,plot]"
      # mypy checks every module under src/spin_dynamics with a non-strict
      # baseline (check_untyped_defs); modules on the "known type debt" list in
      # pyproject.toml are analysed but their errors are suppressed. This is a
      # ratchet, not a full strict type check.
      - name: Baseline type check (mypy, see [tool.mypy] debt list)
        run: python -m mypy
      - name: Full pytest validation with branch coverage
        run: >-
          python -m pytest -q -n 4 --dist loadscope
          --cov=spin_dynamics --cov-branch --cov-report=
      - name: Enforce coverage floor
        run: python -m coverage report

  minimum-dependencies:
    name: Minimum dependencies (ubuntu-latest, py3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            PythonSpinDynamics/pyproject.toml
            PythonSpinDynamics/constraints/minimum.txt
      - name: Install declared minimum numerical stack
        run: >-
          python -m pip install
          -c constraints/minimum.txt
          -e ".[dev,opt,plot]"
      - name: Report resolved versions
        run: >-
          python -c
          "import matplotlib,numpy,scipy; print(numpy.__version__, scipy.__version__, matplotlib.__version__)"
      - name: Minimum-version smoke tests
        run: python -m unittest tests.smoke_tests
      - name: Minimum-version packaging tests
        run: python -m unittest tests.test_packaging

  windows-full-validation:
    name: Full validation (windows-latest, py3.12)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: PythonSpinDynamics/pyproject.toml
      - name: Install package
        run: python -m pip install -e ".[dev,opt,plot]"
      - name: Full pytest validation
        shell: pwsh
        run: |
          python -m pytest -q -n 4 --dist loadscope `
            --ignore=tests/test_coil_peec_fastercap.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/test_coil_peec_fastercap.py

  doc-snippets:
    name: Run documentation snippets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: PythonSpinDynamics/pyproject.toml
      - name: Install package
        run: python -m pip install -e ".[dev,opt,plot]"
      - name: Run every manual and web-documentation snippet
        run: python docs/check_doc_snippets.py --run
        env:
          MPLBACKEND: Agg

  external-references:
    name: Comparisons against external codes (QuTiP, nmrsim)
    runs-on: ubuntu-latest
    env:
      # Fail, rather than skip, if a reference package is missing.
      SPIN_DYNAMICS_REQUIRE_CROSSVAL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: PythonSpinDynamics/pyproject.toml
      - name: Install package with the reference codes
        run: python -m pip install -e ".[dev,opt,crossval]"
      - name: Compare against QuTiP and nmrsim
        run: python -m pytest -q -rs tests/test_external_references.py

  optional-numba:
    name: Optional Numba backend parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: PythonSpinDynamics/pyproject.toml
      - name: Install Numba extra
        run: python -m pip install -e ".[dev,opt,numba]"
      - name: Numba parity tests
        run: python -m pytest tests/test_numba_backend.py tests/test_interference.py -q

  optional-jax:
    name: Optional JAX CPU backend parity
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORM_NAME: cpu
      JAX_ENABLE_X64: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: PythonSpinDynamics/pyproject.toml
      - name: Install JAX extra
        run: python -m pip install -e ".[dev,opt,jax]"
      - name: JAX parity tests
        run: >-
          python -m pytest
          tests/test_jax_backend.py
          tests/test_jax_optimizer.py
          tests/test_batched_sweep.py
          tests/test_batched_nqr.py
          tests/test_grape_solver.py
          tests/test_optimal_control_detection.py
          tests/test_optimal_control_nqr.py
          tests/test_optimal_control_objectives.py
          tests/test_optimal_control_pgse.py
          tests/test_optimal_control_propagation.py
          tests/test_optimal_control_response.py
          -q

  performance-regression:
    name: Performance regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: PythonSpinDynamics/pyproject.toml
      - name: Install benchmark runtime
        run: python -m pip install -e ".[opt]"
      - name: Compare candidate with Git baseline
        env:
          BENCHMARK_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          python -B benchmarks/regression_gate.py
          --baseline-ref "$BENCHMARK_BASE_REF"
          --output .benchmark-regression.json
      - name: Upload benchmark comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-regression-${{ github.sha }}
          path: PythonSpinDynamics/.benchmark-regression.json
          if-no-files-found: warn
          retention-days: 30

  distribution:
    name: Build and install wheel/sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: PythonSpinDynamics/pyproject.toml
      - name: Install build tooling
        run: python -m pip install build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Test installed wheel and console entry point
        run: |
          python -m venv .wheel-test
          .wheel-test/bin/python -m pip install dist/*.whl
          .wheel-test/bin/spin-dynamics --help
          .wheel-test/bin/python scripts/verify_installed_distribution.py
      - name: Test installed source distribution
        run: |
          python -m venv .sdist-test
          .sdist-test/bin/python -m pip install dist/*.tar.gz
          .sdist-test/bin/spin-dynamics --help
          .sdist-test/bin/python scripts/verify_installed_distribution.py
