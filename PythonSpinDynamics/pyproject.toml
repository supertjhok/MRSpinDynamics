[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-spin-dynamics"
version = "0.3.0"
description = "Python workspace for magnetic-resonance spin-dynamics simulations."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "Soumyajit Mandal" }
]
keywords = [
  "nmr",
  "nqr",
  "spin dynamics",
  "cpmg",
  "magnetic resonance",
  "simulation"
]
dependencies = [
  "numpy>=1.24"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics"
]

[project.optional-dependencies]
dev = [
  "jsonschema[format]>=4.18,<5",
  "build>=1.2",
  "coverage[toml]>=7.5",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pytest>=7",
  "pytest-cov>=5",
  "pytest-xdist>=3.5",
  "ruff==0.15.21",
  "tomli>=2; python_version < '3.11'",
  "twine>=5"
]
bench = [
  "pytest-benchmark>=4"
]
opt = [
  "scipy>=1.11",
  "pyamg>=5"
]
fullwave = [
  "h5py>=3.9"
]
numba = [
  "numba>=0.59"
]
jax = [
  "jax>=0.4.28"
]
jax-cuda12 = [
  "jax[cuda12]>=0.4.28"
]
jax-cuda13 = [
  "jax[cuda13]>=0.4.28"
]
perf = [
  "numba>=0.59",
  "jax>=0.4.28"
]
plot = [
  "matplotlib>=3.7",
  "pillow>=9"
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10"
]

[project.scripts]
spin-dynamics = "spin_dynamics.experiment.cli:main"

[project.urls]
Homepage = "https://github.com/supertjhok/MRSpinDynamics"
Documentation = "https://supertjhok.github.io/MRSpinDynamics/"
Source = "https://github.com/supertjhok/MRSpinDynamics"
Issues = "https://github.com/supertjhok/MRSpinDynamics/issues"
Changelog = "https://github.com/supertjhok/MRSpinDynamics/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spin_dynamics = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["E402"]
"tests/test_*.py" = ["E402"]
"tests/octave_fixtures/core.py" = ["F403", "F405"]
"tests/octave_fixtures/optimization.py" = ["F403", "F405"]
"tests/octave_fixtures/support.py" = ["E402", "F401"]
"tests/octave_fixtures/workflows.py" = ["F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Only ``test_*.py`` modules are discovered. ``smoke_tests.py``,
# ``fixture_tests.py`` and ``example_tests.py`` are unittest ``load_tests``
# aggregators that re-import classes from ``test_*.py``; discovering them would
# collect ~550 tests twice. They remain runnable via ``python -m unittest
# tests.smoke_tests`` (CI smoke job) and as explicit pytest paths.
python_files = ["test_*.py"]
markers = [
  "smoke: fast representative checks for edit loops",
  "fixtures: MATLAB/Octave fixture parity checks",
  "optional: checks that exercise optional dependencies",
  "slow: longer numerical validation checks"
]

[tool.mypy]
# Type-check the whole package (not just two files). Non-strict baseline:
# check_untyped_defs everywhere; disallow_untyped_defs/warn_unreachable only for
# the modules already written to that standard. Modules with existing type
# errors are listed in the "known type debt" override below: they are still
# analysed (so their types flow into the checked modules) but their own errors
# are not reported. That list may only shrink -- remove a module once it passes.
python_version = "3.10"
files = ["src/spin_dynamics"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Installed in CI but without type information.
module = ["scipy", "scipy.*", "pyamg", "pyamg.*", "tomli", "tomllib"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional accelerator / I/O extras: treated as Any whether or not they are
# installed, so local runs (with jax/numba) and CI (without) agree.
module = ["jax", "jax.*", "jaxlib", "jaxlib.*", "numba", "numba.*", "h5py", "h5py.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# Fully annotated modules held to the strict standard.
module = ["spin_dynamics.deprecation", "spin_dynamics.experiment.cli"]
disallow_untyped_defs = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Known type debt (86 modules): errors suppressed, not yet fixed.
module = [
  "spin_dynamics._numba_motion",
  "spin_dynamics.absolute_phase",
  "spin_dynamics.analysis.ilt",
  "spin_dynamics.composition",
  "spin_dynamics.core._numba_kernels",
  "spin_dynamics.coupling.isochromats",
  "spin_dynamics.design.adapters",
  "spin_dynamics.design.live",
  "spin_dynamics.design.performance",
  "spin_dynamics.design.priors",
  "spin_dynamics.design.reference_ir",
  "spin_dynamics.design.robustness",
  "spin_dynamics.design.session",
  "spin_dynamics.detection.base",
  "spin_dynamics.detection.gradiometer",
  "spin_dynamics.detection.inductive",
  "spin_dynamics.dnp.dynamics",
  "spin_dynamics.dnp.motion",
  "spin_dynamics.esr.hamiltonians",
  "spin_dynamics.esr.spectra",
  "spin_dynamics.experiment.nano_mr_adapter",
  "spin_dynamics.experiment.sequence_adapter",
  "spin_dynamics.fields.birdcage_circuit",
  "spin_dynamics.fields.domain",
  "spin_dynamics.fields.eddy_modes",
  "spin_dynamics.fields.electropermanent",
  "spin_dynamics.fields.electropermanent_array",
  "spin_dynamics.fields.electropermanent_pulses",
  "spin_dynamics.fields.electropermanent_transient",
  "spin_dynamics.fields.fastercap_interop",
  "spin_dynamics.fields.fullwave_validation",
  "spin_dynamics.fields.gradient_coils",
  "spin_dynamics.fields.gradient_engineering",
  "spin_dynamics.fields.gradient_shielding",
  "spin_dynamics.fields.gradient_windings",
  "spin_dynamics.fields.openems",
  "spin_dynamics.fields.quasistatic",
  "spin_dynamics.interference._numba_cancellers",
  "spin_dynamics.nano_mr.baths",
  "spin_dynamics.nano_mr.exact",
  "spin_dynamics.nano_mr.geometry",
  "spin_dynamics.nano_mr.hamiltonians",
  "spin_dynamics.nano_mr.high_resolution",
  "spin_dynamics.nano_mr.imaging",
  "spin_dynamics.nano_mr.motion",
  "spin_dynamics.nano_mr.presets",
  "spin_dynamics.nano_mr.statistical",
  "spin_dynamics.nqr._cif",
  "spin_dynamics.nqr.crossover",
  "spin_dynamics.nqr.crossover_sequences",
  "spin_dynamics.nqr.field_relaxation",
  "spin_dynamics.nqr.full_dynamics",
  "spin_dynamics.nqr.inhomogeneity",
  "spin_dynamics.nqr.interference",
  "spin_dynamics.nqr.isotopes",
  "spin_dynamics.nqr.polarization_enhancement",
  "spin_dynamics.nqr.relaxation",
  "spin_dynamics.nqr.simulation",
  "spin_dynamics.nqr.zeeman",
  "spin_dynamics.optimal_control.hamiltonians",
  "spin_dynamics.optimization._bounded",
  "spin_dynamics.optimization.excitation",
  "spin_dynamics.optimization.refocusing",
  "spin_dynamics.optimization.results",
  "spin_dynamics.optimization.spa",
  "spin_dynamics.phase_cycling",
  "spin_dynamics.pulse_diagnostics",
  "spin_dynamics.receiver_network",
  "spin_dynamics.sequences.compiler",
  "spin_dynamics.sequences.motion",
  "spin_dynamics.sequences.pulseq",
  "spin_dynamics.susceptibility",
  "spin_dynamics.thermal.electromagnet",
  "spin_dynamics.thermal.sources",
  "spin_dynamics.workflows.diffusion",
  "spin_dynamics.workflows.electropermanent_controller",
  "spin_dynamics.workflows.electropermanent_imaging",
  "spin_dynamics.workflows.electropermanent_particle_spin_echo",
  "spin_dynamics.workflows.fid",
  "spin_dynamics.workflows.portable_halbach",
  "spin_dynamics.workflows.qspace",
  "spin_dynamics.workflows.relaxation",
  "spin_dynamics.workflows.sense",
  "spin_dynamics.workflows.single_sided",
  "spin_dynamics.workflows.slice_selective",
  "spin_dynamics.workflows.time_varying",
]
ignore_errors = true

[tool.coverage.run]
branch = true
source = ["spin_dynamics"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError"
]
