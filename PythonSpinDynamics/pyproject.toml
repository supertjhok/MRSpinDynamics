[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-spin-dynamics"
version = "0.2.0"
description = "Python workspace for magnetic-resonance spin-dynamics simulations."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "Soumyajit Mandal" }
]
keywords = [
  "nmr",
  "nqr",
  "spin dynamics",
  "cpmg",
  "magnetic resonance",
  "simulation"
]
dependencies = [
  "numpy>=1.24"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics"
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.5",
  "mypy>=1.10",
  "pytest>=7",
  "pytest-xdist>=3.5",
  "ruff>=0.4",
  "twine>=5"
]
bench = [
  "pytest-benchmark>=4"
]
opt = [
  "scipy>=1.11",
  "pyamg>=5"
]
numba = [
  "numba>=0.59"
]
jax = [
  "jax>=0.4.28"
]
jax-cuda12 = [
  "jax[cuda12]>=0.4.28"
]
jax-cuda13 = [
  "jax[cuda13]>=0.4.28"
]
perf = [
  "numba>=0.59",
  "jax>=0.4.28"
]
plot = [
  "matplotlib>=3.7",
  "pillow>=9"
]

[project.scripts]
spin-dynamics = "spin_dynamics.experiment.cli:main"

[project.urls]
Homepage = "https://github.com/supertjhok/MRSpinDynamics"
Documentation = "https://github.com/supertjhok/MRSpinDynamics/tree/main/PythonSpinDynamics/docs"
Source = "https://github.com/supertjhok/MRSpinDynamics"
Issues = "https://github.com/supertjhok/MRSpinDynamics/issues"
Changelog = "https://github.com/supertjhok/MRSpinDynamics/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spin_dynamics = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["E402"]
"tests/test_*.py" = ["E402"]
"tests/octave_fixtures/core.py" = ["F403", "F405"]
"tests/octave_fixtures/optimization.py" = ["F403", "F405"]
"tests/octave_fixtures/support.py" = ["E402", "F401"]
"tests/octave_fixtures/workflows.py" = ["F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_tests.py"]
markers = [
  "smoke: fast representative checks for edit loops",
  "fixtures: MATLAB/Octave fixture parity checks",
  "optional: checks that exercise optional dependencies",
  "slow: longer numerical validation checks"
]

[tool.mypy]
python_version = "3.10"
files = [
  "src/spin_dynamics/deprecation.py",
  "src/spin_dynamics/experiment/cli.py"
]
follow_imports = "skip"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

[tool.coverage.run]
branch = true
source = ["spin_dynamics"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError"
]
